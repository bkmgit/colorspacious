language: python
python:
  - 3.9
  - 3.10
  - 3.11
  - 3.12
  - 3.13
  - 3.14
before_install:
  # Escape Travis virtualenv
  - deactivate
  # See: http://conda.pydata.org/docs/travis.html
  - wget http://repo.continuum.io/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh
  - bash miniconda.sh -b -p $HOME/miniconda
  - export PATH="$HOME/miniconda/bin:$PATH"
  - hash -r
  - conda config --set always_yes yes --set changeps1 no
  - conda update -q conda
  - conda info -a
  - conda create -q -n testenv python=$TRAVIS_PYTHON_VERSION
  - source activate testenv
  - conda install pip pynose coverage numpy scipy matplotlib Cython
# nose-cov requires nose which is no longer maintained
# - pip install nose-cov
install:
  - python setup.py sdist
  - mkdir empty
  - cd empty
  - pip install ../dist/*
  - INSTALLDIR=$(python -c "import os; import colorspacious; print(os.path.dirname(colorspacious.__file__))")
script:
#  coverage requires nose-cov which uses nose that is no longer maintained
#  - pynose --all-modules --with-cov --cov-conf ../.coveragerc --cov-report term-missing --cov ${INSTALLDIR} colorspacious
   - pynose --all-modules colorspacious
#after_success:
#  - pip install codecov && codecov
